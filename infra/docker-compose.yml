

services:
  db:
    image: postgres:15-alpine
    container_name: llm_wrapper_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_wrapper

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ../backend
    container_name: llm_wrapper_api
    restart: always

    depends_on:
      - db

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: llm_wrapper
      AUTH_KEY_SECRET: hahahihihahahihihahahihihahahihi
      OPENROUTER_API_KEY: 
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      LLM_MODEL: 
      LLM_TEMPERATURE: 0.1
      LLM_TIMEOUT: 60
      LLM_MAX_RETRIES: 3


    ports:
      - "127.0.0.1:8000:8000"

  nginx:
    image: nginx:stable-alpine

    ports:
      - "8080:80"

    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    

volumes:
  postgres_data:
